<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗地主AI助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }
        
        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-success {
            background: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .card-display {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            min-height: 60px;
        }
        
        .card {
            width: 40px;
            height: 56px;
            background: white;
            border: 2px solid #333;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .card.black {
            color: #333;
        }
        
        .card.red {
            color: #e74c3c;
        }
        
        .suggestion-box {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
            padding: 15px;
            margin-top: 15px;
            border-radius: 0 8px 8px 0;
        }
        
        .suggestion-title {
            font-weight: bold;
            color: #1976d2;
            margin-bottom: 8px;
        }
        
        .play-options {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        
        .play-option {
            padding: 8px 16px;
            background: #fff;
            border: 2px solid #667eea;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .play-option:hover {
            background: #667eea;
            color: white;
        }
        
        .status-message {
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        
        .status-message.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        .status-message.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-message.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .hidden {
            display: none;
        }
        
        .bid-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .bid-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.2s;
        }
        
        .bid-btn:hover, .bid-btn.selected {
            background: #667eea;
            color: white;
        }
        
        .history-log {
            max-height: 300px;
            overflow-y: auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        
        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #eee;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🃏 斗地主AI助手</h1>
        
        <!-- 阶段1: 输入手牌和位置 -->
        <div id="phase1" class="section">
            <div class="section-title">第一步：输入手牌和位置</div>
            
            <div class="input-group">
                <label>你的手牌（17张，如：3456789OJQKA23XX）</label>
                <input type="text" id="hand-input" placeholder="输入17张牌，不区分花色，O代表10，X代表小王">
                <small style="color: #666;">卡牌：3-9 O(10) J Q K A 2 X(小王) D(大王)</small>
            </div>
            
            <div class="input-group">
                <label>你的位置</label>
                <select id="position-select">
                    <option value="0">头叫（第一个叫分）</option>
                    <option value="1">二叫（第二个叫分）</option>
                    <option value="2">三叫（第三个叫分）</option>
                </select>
            </div>
            
            <button class="btn btn-primary" onclick="startGame()">开始游戏</button>
            
            <div id="hand-display" class="card-display hidden"></div>
        </div>
        
        <!-- 阶段2: 叫分 -->
        <div id="phase2" class="section hidden">
            <div class="section-title">第二步：叫分（按位置顺序输入）</div>
            
            <div id="bid-suggestion" class="suggestion-box hidden">
                <div class="suggestion-title">AI建议</div>
                <div id="bid-suggestion-text"></div>
            </div>
            
            <div id="player-bid-section" class="input-group">
                <label>你的叫分</label>
                <div class="bid-buttons">
                    <button class="bid-btn" onclick="makeBid(0, this)">不叫</button>
                    <button class="bid-btn" onclick="makeBid(1, this)">1分</button>
                    <button class="bid-btn" onclick="makeBid(2, this)">2分</button>
                    <button class="bid-btn" onclick="makeBid(3, this)">3分</button>
                </div>
            </div>
            
            <div id="opponent-bid-section" class="input-group hidden">
                <label>输入其他玩家叫分</label>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span>位置 <span id="bid-target-position">0</span>:</span>
                    <select id="opponent-bid-select">
                        <option value="0">不叫</option>
                        <option value="1">1分</option>
                        <option value="2">2分</option>
                        <option value="3">3分</option>
                    </select>
                    <button class="btn btn-primary" onclick="makeOpponentBid()">确认</button>
                </div>
            </div>
            
            <div id="bid-history" style="margin-top: 15px; padding: 10px; background: white; border-radius: 8px;">
                <strong>叫分记录：</strong>
                <div id="bid-history-content">头叫: - | 二叫: - | 三叫: -</div>
            </div>
            
            <div id="bid-status" class="status-message info hidden"></div>
        </div>
        
        <!-- 阶段3: 输入底牌 -->
        <div id="phase3" class="section hidden">
            <div class="section-title">第三步：输入底牌</div>
            
            <div class="input-group">
                <label>三张底牌（如：5A2）</label>
                <input type="text" id="base-cards-input" placeholder="输入3张底牌">
            </div>
            
            <button class="btn btn-primary" onclick="setBaseCards()">确认底牌</button>
        </div>
        
        <!-- 阶段4: 出牌 -->
        <div id="phase4" class="section hidden">
            <div class="section-title">第四步：出牌（按顺序输入）</div>
            
            <div id="landlord-info" class="status-message success" style="margin-bottom: 15px;">
                地主：<span id="landlord-name">-</span>
            </div>
            
            <div class="input-group">
                <label>当前手牌</label>
                <div id="current-hand" class="card-display"></div>
            </div>
            
            <div class="input-group">
                <label>上家出牌</label>
                <div id="last-play" style="font-size: 20px; font-weight: bold; color: #667eea;">-</div>
            </div>
            
            <div id="current-turn-info" class="status-message info" style="margin-bottom: 15px;">
                轮到你了
            </div>
            
            <div id="player-play-section">
                <button class="btn btn-success" onclick="getSuggestion()">获取AI建议</button>
                
                <div id="play-suggestion" class="suggestion-box hidden">
                    <div class="suggestion-title">AI建议出牌</div>
                    <div id="suggested-play" style="font-size: 24px; font-weight: bold; margin: 10px 0;"></div>
                    <div id="pass-notice" class="hidden" style="color: #e74c3c; font-weight: bold; margin-top: 10px;">
                        ⚠️ 你手中的牌无法压制上家，只能选择PASS
                    </div>
                </div>
                
                <div class="input-group">
                    <label>你的出牌（输入如：34567 或 PASS）</label>
                    <input type="text" id="play-input" placeholder="输入你要出的牌">
                </div>
                
                <button class="btn btn-primary" onclick="makePlay()">出牌</button>
            </div>
            
            <div id="opponent-play-section" class="input-group hidden" style="background: #f0f0f0; padding: 15px; border-radius: 8px;">
                <label>输入其他玩家出牌</label>
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <span>位置 <span id="play-target-position">0</span>:</span>
                    <input type="text" id="opponent-play-input" placeholder="如：34567 或 PASS" style="flex: 1; min-width: 150px;">
                    <button class="btn btn-primary" onclick="submitOpponentPlay()">确认</button>
                </div>
            </div>
            
            <div id="play-status" class="status-message info hidden"></div>
            
            <div class="input-group">
                <label>出牌历史</label>
                <div id="play-history" class="history-log"></div>
            </div>
        </div>
    </div>

    <script>
        let gameState = {
            started: false,
            playerPosition: null,
            currentPhase: 1,
            bids: [null, null, null],  // 记录三个位置的叫分
            currentBidPosition: 0,     // 当前轮到叫分的位置
            currentPlayPosition: null, // 当前轮到出牌的位置
            landlord: null,            // 地主位置
            lastPlay: null             // 上家出牌
        };
        
        // 开始游戏
        async function startGame() {
            const hand = document.getElementById('hand-input').value.trim().toUpperCase();
            const position = parseInt(document.getElementById('position-select').value);
            
            if (hand.length !== 17) {
                alert('手牌必须是17张！');
                return;
            }
            
            try {
                const response = await fetch('/api/start', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({hand: hand, position: position})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    gameState.started = true;
                    gameState.playerPosition = position;
                    gameState.currentBidPosition = 0;  // 从头叫开始
                    
                    // 显示手牌
                    displayHand(hand);
                    
                    // 进入叫分阶段
                    document.getElementById('phase1').classList.add('hidden');
                    document.getElementById('phase2').classList.remove('hidden');
                    
                    // 显示AI建议（仅当玩家是头叫时）
                    if (data.bid_suggestion !== null && position === 0) {
                        document.getElementById('bid-suggestion').classList.remove('hidden');
                        document.getElementById('bid-suggestion-text').textContent = 
                            `建议叫 ${data.bid_suggestion} 分`;
                    }
                    
                    // 初始化叫分界面
                    updateBidInterface();
                    updateBidStatus(data.message);
                } else {
                    alert(data.error || '开始游戏失败');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('网络错误');
            }
        }
        
        // 显示手牌
        function displayHand(hand) {
            const display = document.getElementById('hand-display');
            display.innerHTML = '';
            display.classList.remove('hidden');
            
            const cards = hand.split('');
            cards.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card black';
                cardDiv.textContent = card;
                display.appendChild(cardDiv);
            });
        }
        
        // 更新叫分界面
        function updateBidInterface() {
            const pos = gameState.currentBidPosition;
            const playerPos = gameState.playerPosition;
            
            // 更新叫分记录显示
            const bidNames = ['不叫', '1分', '2分', '3分'];
            const bidTexts = gameState.bids.map((b, i) => {
                const name = ['头叫', '二叫', '三叫'][i];
                const val = b === null ? '-' : bidNames[b];
                return `${name}: ${val}`;
            });
            document.getElementById('bid-history-content').textContent = bidTexts.join(' | ');
            
            // 检查是否叫分结束
            const allBids = gameState.bids.every(b => b !== null);
            const hasBid3 = gameState.bids.includes(3);
            
            if (allBids || hasBid3) {
                // 叫分结束，进入底牌阶段
                const maxBid = Math.max(...gameState.bids);
                const landlord = gameState.bids.indexOf(maxBid);
                const bidName = maxBid === 0 ? '流局' : `${maxBid}分`;
                updateBidStatus(`叫分结束！${['头叫', '二叫', '三叫'][landlord]}以${bidName}成为地主`);
                
                setTimeout(() => {
                    document.getElementById('phase2').classList.add('hidden');
                    document.getElementById('phase3').classList.remove('hidden');
                }, 1500);
                return;
            }
            
            // 判断当前轮到谁叫分
            if (pos === playerPos) {
                // 轮到玩家
                document.getElementById('player-bid-section').classList.remove('hidden');
                document.getElementById('opponent-bid-section').classList.add('hidden');
                updateBidStatus(`轮到你了（${['头叫', '二叫', '三叫'][pos]}）`);
            } else {
                // 轮到其他玩家
                document.getElementById('player-bid-section').classList.add('hidden');
                document.getElementById('opponent-bid-section').classList.remove('hidden');
                document.getElementById('bid-target-position').textContent = pos;
                updateBidStatus(`请输入${['头叫', '二叫', '三叫'][pos]}的叫分`);
            }
        }
        
        // 玩家叫分
        async function makeBid(bid, btnElement) {
            // 记录叫分
            gameState.bids[gameState.playerPosition] = bid;
            
            // 高亮选中的按钮
            document.querySelectorAll('.bid-btn').forEach(btn => {
                btn.classList.remove('selected');
            });
            if (btnElement) {
                btnElement.classList.add('selected');
            }
            
            // 移动到下一个位置
            gameState.currentBidPosition = (gameState.currentBidPosition + 1) % 3;
            while (gameState.currentBidPosition < 3 && gameState.bids[gameState.currentBidPosition] !== null) {
                gameState.currentBidPosition++;
            }
            
            // 更新界面
            updateBidInterface();
        }
        
        // 输入其他玩家叫分
        function makeOpponentBid() {
            const bid = parseInt(document.getElementById('opponent-bid-select').value);
            const pos = gameState.currentBidPosition;
            
            // 记录叫分
            gameState.bids[pos] = bid;
            
            // 移动到下一个位置
            gameState.currentBidPosition++;
            while (gameState.currentBidPosition < 3 && gameState.bids[gameState.currentBidPosition] !== null) {
                gameState.currentBidPosition++;
            }
            
            // 更新界面
            updateBidInterface();
        }
        
        // 设置底牌
        async function setBaseCards() {
            const baseCards = document.getElementById('base-cards-input').value.trim().toUpperCase();
            
            if (baseCards.length !== 3) {
                alert('底牌必须是3张！');
                return;
            }
            
            // 计算地主（最高叫分者）
            const maxBid = Math.max(...gameState.bids);
            const landlord = maxBid === 0 ? 0 : gameState.bids.indexOf(maxBid);
            gameState.landlord = landlord;
            
            try {
                const response = await fetch('/api/base_cards', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({base_cards: baseCards, landlord: landlord})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('phase3').classList.add('hidden');
                    document.getElementById('phase4').classList.remove('hidden');
                    
                    // 记录地主和当前出牌位置
                    gameState.landlord = data.landlord;
                    gameState.currentPlayPosition = data.landlord;  // 地主先出牌
                    
                    // 更新手牌显示（地主获得底牌）
                    if (data.landlord === gameState.playerPosition) {
                        const currentHand = document.getElementById('hand-input').value + baseCards;
                        document.getElementById('hand-input').value = currentHand;  // 更新输入框
                        displayHand(currentHand);
                    }
                    
                    updatePlayStatus(data.message);
                    refreshCurrentHand();  // 这会从 hand-input 重新读取并显示
                    updatePlayInterface();  // 初始化出牌界面
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // 获取AI建议
        async function getSuggestion() {
            try {
                const response = await fetch('/api/suggest_play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('play-suggestion').classList.remove('hidden');
                    document.getElementById('suggested-play').textContent = data.suggestion;
                    
                    // 判断是否只能PASS
                    const passNotice = document.getElementById('pass-notice');
                    if (data.can_only_pass) {
                        passNotice.classList.remove('hidden');
                    } else {
                        passNotice.classList.add('hidden');
                    }
                    
                    // 自动填充建议的出牌到输入框
                    document.getElementById('play-input').value = data.suggestion;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // 出牌
        async function makePlay() {
            const play = document.getElementById('play-input').value.trim().toUpperCase();
            
            if (!play) {
                alert('请输入要出的牌！');
                return;
            }
            
            try {
                const response = await fetch('/api/play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({play: play})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    updatePlayStatus(`你出了: ${data.play}`);
                    addToHistory(`你: ${data.play}`);
                    
                    // 更新手牌显示
                    displayHand(data.remaining_hand.join(''));
                    
                    if (data.game_over) {
                        updatePlayStatus(`游戏结束！获胜方: ${data.winner}`, 'success');
                    } else {
                        document.getElementById('last-play').textContent = data.play;
                        document.getElementById('play-input').value = '';
                    }
                } else {
                    updatePlayStatus(data.error || '出牌失败', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // 更新出牌界面
        function updatePlayInterface() {
            const pos = gameState.currentPlayPosition;
            const playerPos = gameState.playerPosition;
            
            // 显示地主信息
            const landlord = gameState.landlord;
            if (landlord !== null) {
                document.getElementById('landlord-name').textContent = 
                    `${['头叫', '二叫', '三叫'][landlord]}${landlord === playerPos ? ' (你)' : ''}`;
            }
            
            document.getElementById('current-turn-info').textContent = 
                `轮到${['头叫', '二叫', '三叫'][pos]}${pos === playerPos ? ' (你)' : ''}出牌`;
            
            if (pos === playerPos) {
                // 轮到玩家
                document.getElementById('player-play-section').classList.remove('hidden');
                document.getElementById('opponent-play-section').classList.add('hidden');
                updatePlayStatus('轮到你了！');
            } else {
                // 轮到其他玩家
                document.getElementById('player-play-section').classList.add('hidden');
                document.getElementById('opponent-play-section').classList.remove('hidden');
                document.getElementById('play-target-position').textContent = pos;
                updatePlayStatus(`请输入${['头叫', '二叫', '三叫'][pos]}的出牌`);
            }
        }
        
        // 提交其他玩家出牌
        async function submitOpponentPlay() {
            const play = document.getElementById('opponent-play-input').value.trim().toUpperCase();
            const pos = gameState.currentPlayPosition;
            
            if (!play) {
                alert('请输入出牌！');
                return;
            }
            
            try {
                const response = await fetch('/api/opponent_play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({position: pos, play: play})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addToHistory(`${['头叫', '二叫', '三叫'][pos]}: ${play}`);
                    
                    // 检查是否新一轮开始
                    if (data.new_round) {
                        gameState.lastPlay = null;
                        document.getElementById('last-play').textContent = '-';
                        updatePlayStatus('新一轮开始，可以自由出牌');
                    } else if (play !== 'PASS') {
                        // 更新上家出牌
                        gameState.lastPlay = play;
                        document.getElementById('last-play').textContent = play;
                    }
                    
                    // 移动到下一个位置
                    gameState.currentPlayPosition = (pos + 1) % 3;
                    document.getElementById('opponent-play-input').value = '';
                    
                    // 更新界面
                    updatePlayInterface();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // 修改玩家出牌后的处理
        async function makePlay() {
            const play = document.getElementById('play-input').value.trim().toUpperCase();
            
            if (!play) {
                alert('请输入要出的牌！');
                return;
            }
            
            try {
                const response = await fetch('/api/play', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({play: play})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    addToHistory(`你: ${play}`);
                    
                    // 更新手牌显示
                    updateHandDisplay(data.remaining_hand);
                    
                    if (data.game_over) {
                        updatePlayStatus(`游戏结束！获胜方: ${data.winner}`, 'success');
                    } else {
                        // 检查是否新一轮开始
                        if (data.new_round) {
                            gameState.lastPlay = null;
                            document.getElementById('last-play').textContent = '-';
                            updatePlayStatus('新一轮开始，可以自由出牌');
                        } else if (play !== 'PASS') {
                            // 更新上家出牌
                            gameState.lastPlay = play;
                            document.getElementById('last-play').textContent = play;
                        }
                        
                        // 移动到下一个位置
                        gameState.currentPlayPosition = (gameState.playerPosition + 1) % 3;
                        document.getElementById('play-input').value = '';
                        
                        // 更新界面
                        updatePlayInterface();
                    }
                } else {
                    updatePlayStatus(data.error || '出牌失败', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        // 更新状态消息
        function updateBidStatus(message, type = 'info') {
            const status = document.getElementById('bid-status');
            status.textContent = message;
            status.className = `status-message ${type}`;
            status.classList.remove('hidden');
        }
        
        function updatePlayStatus(message, type = 'info') {
            const status = document.getElementById('play-status');
            status.textContent = message;
            status.className = `status-message ${type}`;
            status.classList.remove('hidden');
        }
        
        // 添加到历史记录
        function addToHistory(entry) {
            const history = document.getElementById('play-history');
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.textContent = entry;
            history.insertBefore(div, history.firstChild);
        }
        
        // 刷新当前手牌
        function refreshCurrentHand() {
            const handDisplay = document.getElementById('current-hand');
            const handInput = document.getElementById('hand-input').value;
            
            handDisplay.innerHTML = '';
            
            // 从输入框获取当前手牌并显示
            const cards = handInput.split('');
            cards.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card black';
                cardDiv.textContent = card;
                handDisplay.appendChild(cardDiv);
            });
        }
        
        // 更新手牌显示（出牌后）
        function updateHandDisplay(remainingHand) {
            const handDisplay = document.getElementById('current-hand');
            const handInput = document.getElementById('hand-input');
            
            // 更新输入框
            handInput.value = remainingHand.join('');
            
            // 更新显示
            handDisplay.innerHTML = '';
            remainingHand.forEach(card => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card black';
                cardDiv.textContent = card;
                handDisplay.appendChild(cardDiv);
            });
        }
    </script>
</body>
</html>
